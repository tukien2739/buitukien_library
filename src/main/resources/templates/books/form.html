
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Thêm / Sửa sách</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"
                th:text="${book.id == null}
                    ? 'Thêm sách mới'
                    : 'Chỉnh sửa sách'">
                Thêm sách mới
            </h4>
        </div>

        <div class="card-body">

            <form th:action="@{/books/save}"
                  th:object="${book}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <!-- Lỗi nghiệp vụ -->
                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">

                    <p th:each="err : ${#fields.globalErrors()}"
                       th:text="${err}"
                       class="mb-0"></p>
                </div>

                <!-- Mã sách -->
                <div class="mb-3">
                    <label for="code" class="form-label">
                        Mã sách
                    </label>

                    <input type="text"
                           id="code"
                           th:field="*{code}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           placeholder="Ví dụ: B001">

                    <div class="invalid-feedback"
                         th:errors="*{code}"></div>
                </div>

                <!-- Tên sách -->
                <div class="mb-3">
                    <label for="title" class="form-label">
                        Tên sách
                    </label>

                    <input type="text"
                           id="title"
                           th:field="*{title}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           placeholder="Nhập tên sách">

                    <div class="invalid-feedback"
                         th:errors="*{title}"></div>
                </div>

                <!-- Tác giả -->
                <div class="mb-3">
                    <label for="author" class="form-label">
                        Tác giả
                    </label>

                    <input type="text"
                           id="author"
                           th:field="*{author}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           placeholder="Nhập tên tác giả">

                    <div class="invalid-feedback"
                         th:errors="*{author}"></div>
                </div>

                <!-- Năm xuất bản -->
                <div class="mb-3">
                    <label for="publishYear" class="form-label">
                        Năm xuất bản
                    </label>

                    <input type="number"
                           id="publishYear"
                           th:field="*{publishYear}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           min="1000"
                           placeholder="Ví dụ: 2024">

                    <div class="invalid-feedback"
                         th:errors="*{publishYear}"></div>
                </div>

                <!-- Số lượng -->
                <div class="mb-3">
                    <label for="quantity" class="form-label">
                        Số lượng
                    </label>

                    <input type="number"
                           id="quantity"
                           th:field="*{quantity}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           min="0"
                           placeholder="Nhập số lượng">

                    <div class="invalid-feedback"
                         th:errors="*{quantity}"></div>
                </div>

                <!-- Thể loại -->
                <div class="mb-3">
                    <label for="categoryId" class="form-label">
                        Thể loại
                    </label>

                    <select id="categoryId"
                            th:field="*{category.id}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('category') or #fields.hasErrors('category.id')} ? 'is-invalid'">

                        <option value="">
                            -- Chọn thể loại --
                        </option>

                        <option
                                th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                        </option>
                    </select>

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('category')}"
                         th:errors="*{category}">
                    </div>

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('category.id')}"
                         th:errors="*{category.id}">
                    </div>

                    <p th:if="${#lists.isEmpty(categories)}"
                       class="text-warning mt-2">
                        Chưa có thể loại.
                        Vui lòng tạo thể loại trước khi thêm sách.
                    </p>
                </div>

                <!-- Nút thao tác -->
                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary"
                            th:disabled="${#lists.isEmpty(categories)}">
                        Lưu sách
                    </button>

                    <a th:href="@{/books}"
                       class="btn btn-secondary">
                        Quay lại
                    </a>

                    <a th:href="@{/categories}"
                       class="btn btn-outline-primary">
                        Quản lý thể loại
                    </a>

                </div>

            </form>
        </div>
    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
