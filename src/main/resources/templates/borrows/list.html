
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Danh sách đang mượn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Tiêu đề -->
    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <h2>Danh sách đang mượn</h2>

        <a th:href="@{/books}"
           class="btn btn-primary">
            Xem danh sách sách
        </a>
    </div>

    <!-- Thông báo thành công -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show">

        <span th:text="${successMessage}"></span>

        <button class="btn-close"
                type="button"
                data-bs-dismiss="alert">
        </button>
    </div>

    <!-- Thông báo lỗi -->
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show">

        <span th:text="${errorMessage}"></span>

        <button class="btn-close"
                type="button"
                data-bs-dismiss="alert">
        </button>
    </div>

    <!-- Bảng -->
    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered
                              table-hover align-middle">

                    <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Tên sách</th>
                        <th>Người mượn</th>
                        <th>Email</th>
                        <th>Ngày mượn</th>
                        <th>Hạn trả</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="borrow : ${borrows}"
                        th:classappend="${borrow.overdue} ? 'table-danger'">

                        <td th:text="${borrow.id}"></td>

                        <td th:text="${borrow.book.title}"></td>

                        <td th:text="${borrow.borrowerName}"></td>

                        <td th:text="${borrow.email}"></td>

                        <td th:text="${#temporals.format(
                            borrow.borrowDate, 'dd/MM/yyyy')}">
                        </td>

                        <td th:text="${#temporals.format(
                            borrow.dueDate, 'dd/MM/yyyy')}">
                        </td>

                        <!-- Trạng thái -->
                        <td>

                            <span th:if="${borrow.overdue}"
                                  class="badge bg-danger">
                                Quá hạn
                            </span>

                            <span th:unless="${borrow.overdue}"
                                  class="badge bg-warning text-dark">
                                Đang mượn
                            </span>

                        </td>

                        <!-- Nút trả sách -->
                        <td>

                            <form th:action="@{/borrows/{id}/return(id=${borrow.id})}"
                                  method="post"
                                  onsubmit="return confirm('Xác nhận đã nhận lại sách?');">

                                <button type="submit"
                                        class="btn btn-success btn-sm">
                                    Trả sách
                                </button>

                            </form>

                        </td>

                    </tr>

                    <!-- Danh sách rỗng -->
                    <tr th:if="${#lists.isEmpty(borrows)}">

                        <td colspan="8"
                            class="text-center text-muted py-4">
                            Hiện không có sách nào đang được mượn.
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
