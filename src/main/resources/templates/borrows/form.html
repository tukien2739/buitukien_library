
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Mượn sách - Quản lý thư viện</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="card shadow-sm mx-auto"
         style="max-width: 650px;">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Mượn sách</h4>
        </div>

        <div class="card-body">

            <!-- Thông báo lỗi -->
            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 th:text="${errorMessage}">
            </div>

            <!-- Thông tin sách -->
            <div class="alert alert-info"
                 th:if="${book != null}">

                <strong>Sách:</strong>
                <span th:text="${book.title}"></span>

                <div>
                    <strong>Mã sách:</strong>
                    <span th:text="${book.code}"></span>
                </div>

                <div>
                    <strong>Số lượng còn:</strong>
                    <span th:text="${book.quantity}"></span>
                </div>
            </div>

            <!-- Form mượn -->
            <form th:action="@{/borrows/save}"
                  th:object="${borrow}"
                  method="post">

                <!-- ID sách -->
                <input type="hidden"
                       th:field="*{book.id}">

                <!-- Lỗi chung -->
                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">

                    <p th:each="err : ${#fields.globalErrors()}"
                       th:text="${err}"
                       class="mb-0"></p>
                </div>

                <!-- Người mượn -->
                <div class="mb-3">

                    <label for="borrowerName"
                           class="form-label">
                        Tên người mượn
                    </label>

                    <input type="text"
                           id="borrowerName"
                           th:field="*{borrowerName}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           placeholder="Nhập họ và tên">

                    <div class="invalid-feedback"
                         th:errors="*{borrowerName}">
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">

                    <label for="email"
                           class="form-label">
                        Email người mượn
                    </label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           placeholder="example@gmail.com">

                    <div class="invalid-feedback"
                         th:errors="*{email}">
                    </div>
                </div>

                <!-- Hạn trả -->
                <div class="mb-3">

                    <label for="dueDate"
                           class="form-label">
                        Hạn trả sách
                    </label>

                    <input type="date"
                           id="dueDate"
                           th:field="*{dueDate}"
                           class="form-control"
                           th:errorclass="is-invalid">

                    <div class="invalid-feedback"
                         th:errors="*{dueDate}">
                    </div>
                </div>

                <!-- Nút -->
                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Xác nhận mượn
                    </button>

                    <a th:href="@{/books}"
                       class="btn btn-secondary">
                        Quay lại
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
